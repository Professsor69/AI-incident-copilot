[tool.poetry]
name = "ai-incident-copilot"
version = "0.1.0"
description = "A production-grade AI agent for autonomous incident diagnosis using Hybrid RAG, agentic reasoning loops, and LLM-as-a-Judge evaluation."
authors = ["Professsor69 <kushagra458377@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/Professsor69/AI-incident-copilot"
keywords = ["ai", "llm", "incident-management", "rag", "fastapi", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
packages = [{include = "api"}, {include = "agent"}, {include = "rag"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
google-generativeai = "^0.8.0"
openai = "^1.40.0"
chromadb = "^0.5.0"
rank-bm25 = "^0.2.2"
sentence-transformers = "^3.0.0"
redis = "^5.0.0"
sse-starlette = "^2.1.0"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
tiktoken = "^0.7.0"
aiofiles = "^24.1.0"
langfuse = "^2.40.0"
rich = "^13.7.0"
typer = "^0.12.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.0"
mypy = "^1.11.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
fakeredis = "^2.23.0"
types-redis = "^4.6.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
run-evals = "eval.run_evals:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["data/", "docs/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
